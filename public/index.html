<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#203d35" />
    <meta
      name="description"
      content="Deux rois, une terre inconnue. Explorez, construisez et faites prospérer votre royaume dans un jeu de stratégie à deux."
    />
    <title>KingBuilder — Le duel des royaumes</title>
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="stylesheet" href="src/styles/ui.css" />
    <link rel="stylesheet" href="src/styles/tabletop.css" />
    <link rel="stylesheet" href="src/styles/menu.css" />
  </head>
  <body>
    <section id="main-menu" class="main-menu" aria-labelledby="menu-title">
      <div class="menu-intro">
        <span class="menu-crest" aria-hidden="true">♛</span>
        <h1 id="menu-title">King<span>Builder</span></h1>
      </div>
      <button id="resume-game" class="primary" hidden>Reprendre la partie</button>
      <div class="mode-grid" aria-label="Modes de jeu">
        <button class="mode-card" data-game-mode="solo">
          <span class="mode-icon" aria-hidden="true">♔</span
          ><span
            ><strong>Solo</strong
            ><small
              >Bâtissez votre royaume et visez le meilleur score en 25
              tours.</small
            ></span
          ><span aria-hidden="true">→</span>
        </button>
        <button class="mode-card" disabled>
          <span class="mode-icon" aria-hidden="true">♟</span
          ><span
            ><strong>Versus bot</strong
            ><small>Affrontez un royaume contrôlé par l’ordinateur.</small
            ><span class="mode-lock">🔒 Bientôt disponible</span></span
          >
        </button>
        <button class="mode-card" data-game-mode="local">
          <span class="mode-icon" aria-hidden="true">♔♔</span
          ><span
            ><strong>Local multiplayer</strong
            ><small
              >Deux royaumes, deux joueurs, à tour de rôle sur le même
              écran.</small
            ></span
          ><span aria-hidden="true">→</span>
        </button>
        <button class="mode-card" disabled>
          <span class="mode-icon" aria-hidden="true">◎</span
          ><span
            ><strong>Online multiplayer</strong
            ><small>Défiez d’autres joueurs en ligne.</small
            ><span class="mode-lock">🔒 Bientôt disponible</span></span
          >
        </button>
      </div>
    </section>
    <header class="topbar" hidden>
      <a class="brand" href="./"
        ><span class="brand-icon">▧</span
        ><span>KING<span class="brand-light">BUILDER</span></span></a
      >
      <nav>
        <button id="rules-button">Les règles <span>↗</span></button
        ><button id="menu-button" class="quiet">
          Revenir au menu principal
        </button>
      </nav>
    </header>
    <main aria-busy="true" hidden>
      <div id="game-notice" class="game-notice" role="status" hidden></div>
      <section id="players" class="players" aria-label="Royaumes"></section>
      <div class="game-layout">
        <div class="land-column">
          <section class="market-panel">
            <div class="section-title">
              <h2 aria-label="Terrains" title="Terrains"><img class="market-heading-icon" src="assets/textures/icon-terrain.svg" alt="" /></h2>
              <button
                id="reroll-terrain"
                class="reroll"
                aria-label="Relancer les terrains"
              ></button>
            </div>
            <div id="tile-market" class="tile-market"></div>
            <div class="tile-controls">
              <button id="rotate">↻ Pivoter</button
              ><span id="rotation-label">0°</span>
            </div>
          </section>
          <section class="workers-panel" aria-label="Ouvriers disponibles">
            <strong>Ouvriers disponibles</strong>
            <div id="worker-list" data-worker-reserve></div>
          </section>
        </div>
        <section class="map-panel">
          <div
            id="missions"
            class="missions"
            aria-label="Missions communes"
          ></div>
          <div class="board-toolbar">
            <div class="board-modes" aria-label="Interaction avec le plateau">
              <button data-mode="move" class="selected" aria-pressed="true">
                Déplacer</button
              ><button data-mode="inspect" aria-pressed="false">
                Inspecter
              </button>
            </div>
            <div class="round" aria-label="Tour de jeu" title="Tour de jeu">
              <img src="assets/textures/icon-hourglass.svg" alt="" />
              <strong id="round">01 / 25</strong>
            </div>
          </div>
          <div id="map-scroll" class="map-scroll">
            <div
              id="board"
              class="board"
              role="grid"
              aria-label="Plateau de jeu"
            ></div>
          </div>
          <div id="selection" class="selection" aria-live="polite"></div>
          <div id="placement-help" class="placement-help" role="status"></div>
          <div id="trade-info" class="trade-info"></div>
          <div id="harvest" class="harvest-panel" aria-live="polite"></div>
        </section>
        <button id="end-turn" class="primary">Fin de tour →</button>
        <div class="building-column">
          <section class="market-panel">
            <div class="section-title">
              <h2 aria-label="Bâtiments" title="Bâtiments"><img class="market-heading-icon" src="assets/textures/buildings-house.svg" alt="" /></h2>
              <button
                id="reroll-building"
                class="reroll"
                aria-label="Relancer les bâtiments"
              ></button>
            </div>
            <div id="building-market" class="building-market"></div>
            <div class="tile-controls">
              <button id="rotate-building">↻ Pivoter</button
              ><span id="building-rotation-label">0°</span>
            </div>
          </section>
          <div id="barracks-list"></div>
        </div>
      </div>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="building-details-dialog" aria-labelledby="building-details-title">
      <div id="building-details-content"></div>
      <button class="primary close-building-details" autofocus>Fermer les détails</button>
    </dialog>
    <dialog id="rules-dialog" aria-labelledby="rules-title">
      <button class="close" aria-label="Fermer">×</button
      ><span class="eyebrow">LE LIVRE DU ROYAUME</span>
      <h2 id="rules-title">Les règles du duel</h2>
      <div class="rules-content"></div>
      <button class="primary close-rules">Fermer</button>
    </dialog>
    <dialog id="result-dialog" aria-labelledby="winner">
      <span class="eyebrow">LES CHRONIQUES S’ACHÈVENT</span>
      <h2 id="winner"></h2>
      <div id="results"></div>
      <button class="primary close-results">Voir le plateau →</button>
    </dialog>
    <dialog id="prestige-dialog" aria-labelledby="prestige-title">
      <h2 id="prestige-title">Acheter les ressources manquantes ?</h2>
      <p id="prestige-warning"></p>
      <div class="dialog-actions">
        <button class="cancel secondary">Annuler</button
        ><button class="confirm primary">Confirmer</button>
      </div>
    </dialog>
    <script type="module" src="src/bootstrap.js"></script>
  </body>
</html>
