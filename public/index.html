<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#203d35" />
    <meta
      name="description"
      content="" data-i18n-content="static.aBoardGameOfExplorationBuildingAnd"
    />
    <title>Kingbuilder</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kingbuilder" />
    <meta property="og:description" content="" data-i18n-content="static.aBoardGameOfExplorationBuildingAnd" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kingbuilder" />
    <meta name="twitter:description" content="" data-i18n-content="static.aBoardGameOfExplorationBuildingAnd" />
    <link rel="icon" type="image/svg+xml" href="assets/textures/interface/kingbuilder.svg" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="stylesheet" href="src/styles/ui.css" />
    <link rel="stylesheet" href="src/styles/tabletop.css" />
    <link rel="stylesheet" href="src/styles/menu.css" />
    <link rel="stylesheet" href="src/styles/identity.css" />
    <link rel="stylesheet" href="src/styles/mobile.css" />
  </head>
  <body>
    <section id="main-menu" class="main-menu" aria-labelledby="menu-title">
      <div class="language-picker"><button id="language-toggle" class="language-toggle" type="button" data-i18n-aria-label="language.switch"><img id="language-flag" src="assets/textures/interface/flag-fr.svg" alt="" aria-hidden="true" /></button></div>
      <div class="menu-intro">
        <span class="menu-crest" aria-hidden="true"><img src="assets/textures/interface/kingbuilder.svg" alt="" /></span>
        <h1 id="menu-title">King<span>Builder</span></h1>
        <div class="terrain-ribbon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="mode-grid" aria-label="" data-i18n-aria-label="static.gameModes">
        <button class="mode-card" data-game-mode="solo">
          <span class="mode-icon" aria-hidden="true"><img src="assets/textures/interface/solo.svg" alt="" /></span
          ><span
            ><strong data-i18n="static.solo"></strong
            ><small
               data-i18n="static.noOpponent"></small
            ></span
          ><span aria-hidden="true">→</span>
        </button>
        <button class="mode-card" disabled>
          <span class="mode-icon" aria-hidden="true"><img src="assets/textures/interface/bot.svg" alt="" /></span
          ><span
            ><strong data-i18n="static.versusBot"></strong
            ><small data-i18n="static.playAgainstTheComputer"></small
            ><span class="mode-lock" data-i18n="static.comingSoon"></span></span
          >
        </button>
        <button class="mode-card" data-game-mode="local">
          <span class="mode-icon" aria-hidden="true"><img src="assets/textures/interface/local.svg" alt="" /></span
          ><span
            ><strong data-i18n="static.twoPlayersLocal"></strong
            ><small
               data-i18n="static.twoPlayersOnTheSameScreen"></small
            ></span
          ><span aria-hidden="true">→</span>
        </button>
        <button class="mode-card" id="online-menu"><span class="mode-icon" aria-hidden="true"><img src="assets/textures/interface/online.svg" alt="" /></span><span><strong data-i18n="static.playOnline"></strong><small data-i18n="static.createAGameOrJoinAFriend"></small></span><span aria-hidden="true">→</span></button>
      </div>
      <button id="catalogue-button" class="mode-card catalogue-entry" aria-haspopup="dialog"><span class="mode-icon" aria-hidden="true"><img src="assets/textures/interface/catalogue.svg" alt="" /></span><span><strong data-i18n="static.catalogue"></strong><small data-i18n="static.theTilesAndBuildingsOfYourNext"></small></span><span aria-hidden="true">→</span></button>
      <button id="menu-rules-button" class="mode-card catalogue-entry" aria-haspopup="dialog" aria-controls="rules-dialog"><span class="mode-icon" aria-hidden="true"><img src="assets/textures/interface/rules.svg" alt="" /></span><span><strong data-i18n="static.rules"></strong></span><span aria-hidden="true">→</span></button>
      <section id="game-history" class="game-history" aria-labelledby="history-title" hidden><h2 id="history-title" data-i18n="static.recentGames"></h2><div id="history-list"></div></section>
    </section>
    <header class="topbar" hidden>
      <a class="brand" href="./"
        ><span class="brand-icon" aria-hidden="true"><img src="assets/textures/interface/kingbuilder.svg" alt="" /></span
        ><span>King<span class="brand-light">Builder</span></span></a
      >
      <nav>
        <button id="game-catalogue-button" aria-haspopup="dialog" aria-controls="catalogue-dialog"><span data-i18n="static.catalogue"></span><span aria-hidden="true">↗</span></button>
        <button id="rules-button"><span data-i18n="static.rules2"></span><span>↗</span></button
        ><button id="menu-button" class="quiet" data-i18n="app.mainMenu"></button>
      </nav>
    </header>
    <main aria-busy="true" hidden>
      <p id="online-status" role="status" hidden style="overflow-wrap:anywhere"></p>
      <section id="players" class="players" aria-label="" data-i18n-aria-label="static.kingdoms"></section>
      <div class="game-layout">
        <div class="land-column">
          <section class="market-panel">
            <div class="section-title">
              <h2 aria-label="" data-i18n-aria-label="static.terrain" title="" data-i18n-title="static.terrain"><img class="market-heading-icon" src="assets/textures/interface/terrain.svg" alt="" /></h2>
              <button
                id="reroll-terrain"
                class="reroll"
                aria-label="" data-i18n-aria-label="static.rerollTerrain"
              ></button>
            </div>
            <div id="tile-market" class="tile-market"></div>
            <div id="single-terrain"></div>
            <div class="tile-controls">
              <button id="rotate" data-i18n="static.rotate"></button
              ><button id="mirror" aria-pressed="false" title="Symétrie (S)" data-i18n="static.mirror"></button><span id="rotation-label">0°</span>
            </div>
          </section>
          <section class="workers-panel" aria-label="" data-i18n-aria-label="static.availableWorkers">
            <strong data-i18n="static.availableWorkers"></strong>
            <div id="worker-list"></div>
          </section>
        </div>
        <section class="map-panel">
          <div
            id="missions"
            class="missions"
            aria-label="" data-i18n-aria-label="static.sharedMissions"
          ></div>
          <div class="board-toolbar">
            <div class="board-modes" aria-label="" data-i18n-aria-label="static.boardInteraction">
              <button data-mode="move" class="selected" aria-pressed="true" data-i18n="static.move"></button
              ><button data-mode="inspect" aria-pressed="false" data-i18n="static.inspect"></button><button id="undo-action" class="secondary" aria-label="" data-i18n-aria-label="static.undoTheLastAction" title="" data-i18n-title="static.undoTheLastAction" disabled data-i18n="static.undo"></button>
            </div>
            <div class="round" aria-label="" data-i18n-aria-label="static.gameTurn" title="" data-i18n-title="static.gameTurn">
              <img src="assets/textures/interface/hourglass.svg" alt="" />
              <strong id="round">01 / 25</strong>
            </div>
          </div>
          <div id="opening-status" class="opening-status" role="status" hidden></div>
          <div id="map-scroll" class="map-scroll">
            <div
              id="board"
              class="board"
              role="grid"
              aria-label="" data-i18n-aria-label="static.gameBoard"
            ></div>
          </div>
          <div id="selection" class="selection" aria-live="polite"></div>
          <div id="placement-help" class="placement-help" role="status"></div>
          <div class="mobile-placement-controls" aria-label="" data-i18n-aria-label="static.cardPlacement">
            <span id="placement-rotation-label" aria-live="polite">0°</span>
            <button id="rotate-placement" disabled data-i18n="static.rotate"></button>
            <button id="mirror-placement" disabled aria-pressed="false" data-i18n="static.mirror"></button>
            <button id="cancel-placement" disabled data-i18n-aria-label="static.clearSelection">×</button>
          </div>
          <div id="harvest" class="harvest-panel" aria-live="polite"></div>
        </section>
        <div class="building-column">
          <section class="market-panel">
            <div class="section-title">
              <h2 aria-label="" data-i18n-aria-label="views.buildings" title="" data-i18n-title="views.buildings"><img class="market-heading-icon" src="assets/textures/buildings/house.svg" alt="" /></h2>
              <button
                id="reroll-building"
                class="reroll"
                aria-label="" data-i18n-aria-label="static.rerollBuildings"
              ></button>
            </div>
            <div id="building-market" class="building-market"></div>
            <div class="tile-controls">
              <button id="rotate-building" data-i18n="static.rotate"></button
              ><button id="mirror-building" aria-pressed="false" title="Symétrie (S)" data-i18n="static.mirror"></button><span id="building-rotation-label">0°</span>
            </div>
          </section>
          <button id="end-turn" class="primary" data-i18n="static.endTurn"></button>
          <div id="barracks-list"></div>
        </div>
      </div>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="online-dialog" class="online-dialog" aria-labelledby="online-title">
      <button id="online-close" class="close dialog-close" type="button" data-i18n-aria-label="static.close">×</button>
      <h2 id="online-title" data-i18n="static.playOnline"></h2>
      <p id="online-health" class="online-health" role="status" aria-live="polite"></p>
      <div id="nickname-row"><input id="nickname" maxlength="24" autocomplete="nickname" placeholder="" data-i18n-placeholder="static.yourNickname" aria-label="" data-i18n-aria-label="static.yourNickname" /></div>
      <button id="online-create" class="primary" type="button" data-i18n="static.createGame"></button>
      <div class="online-join"><label for="online-code" data-i18n="static.joinWithACode"></label><input id="online-code" maxlength="10" autocomplete="off" placeholder="" data-i18n-placeholder="static.10CharacterCode" /><button id="online-join" class="primary" type="button" data-i18n="static.join"></button></div>
      <div class="dialog-actions"><button id="online-resume" class="secondary" type="button" disabled data-i18n="static.resumeMyGame" data-i18n-title="online.resumeExplanation"></button></div>
    </dialog>
    <dialog id="game-settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <button id="settings-cancel" class="close dialog-close" type="button" data-i18n-aria-label="static.close">×</button>
      <span class="eyebrow" id="settings-mode" data-i18n="static.newGame"></span>
      <h2 id="settings-title" data-i18n="app.setUpYourKingdom"></h2>
      <div id="lobby-info" hidden><p id="lobby-players" role="status"></p><p><span data-i18n="static.code"></span><strong id="lobby-code"></strong></p><button id="lobby-copy-link" type="button" data-i18n="static.copyLink"></button> <button id="lobby-copy-code" type="button" data-i18n="static.copyCode"></button></div>
      <label id="setting-clock-row" class="setting-row" hidden for="setting-clock"><span><strong data-i18n="static.timeLimitPerTurn"></strong><small data-i18n="static.terrainSetupHasNoTimeLimit"></small></span><select id="setting-clock"><option value="0" data-i18n="clock.unlimited"></option><option value="30" data-i18n="clock.seconds30"></option><option value="60" data-i18n="clock.seconds60"></option><option value="90" data-i18n="clock.seconds90"></option><option value="120" data-i18n="clock.seconds120"></option><option value="150" data-i18n="clock.seconds150"></option><option value="180" data-i18n="clock.seconds180"></option></select></label>
      <div class="settings-list">
        <label class="setting-row mission-setting" for="setting-missions">
          <span><strong data-i18n="settings.missions"></strong></span>
          <input id="setting-missions" type="checkbox" role="switch" checked />
        </label>
        <label class="setting-row" for="setting-rounds">
          <span><strong data-i18n="static.numberOfTurns"></strong><small data-i18n="static.20To40TurnsPerPlayer"></small></span>
          <output id="setting-rounds-value" for="setting-rounds">25</output>
          <input id="setting-rounds" type="range" min="20" max="40" step="1" value="25" />
        </label>
        <label class="setting-row map-setting" for="setting-map">
          <span><strong data-i18n="maps.choose"></strong><small id="setting-map-description" data-i18n="maps.randomHelp"></small></span>
          <select id="setting-map"></select>
        </label>
        <label class="setting-row" for="setting-opening">
          <span><strong data-i18n="static.setupTiles"></strong><small data-i18n="static.placedByEachPlayerBeforeTurn1"></small></span>
          <output id="setting-opening-value" for="setting-opening">0</output>
          <input id="setting-opening" type="range" min="0" max="2" step="1" value="0" />
        </label>
        <label class="setting-row" for="setting-board">
          <span><strong data-i18n="static.boardSize"></strong><small data-i18n="static.77To1515Spaces"></small></span>
          <output id="setting-board-value" for="setting-board">11 × 11</output>
          <input id="setting-board" type="range" min="9" max="13" step="2" value="11" />
        </label>
      </div>
      <fieldset class="resource-settings">
        <legend data-i18n="static.startingResources"></legend>
        <p data-i18n="static.theSecondPlayerAlwaysReceives1Extra"></p>
        <div class="resource-sliders">
          <label for="setting-material"><span data-i18n="resources.material.name"></span><output id="setting-material-value" for="setting-material">3</output><input id="setting-material" type="range" min="0" max="10" step="1" value="3" /></label>
          <label for="setting-food"><span data-i18n="resources.food.name"></span><output id="setting-food-value" for="setting-food">2</output><input id="setting-food" type="range" min="0" max="10" step="1" value="2" /></label>
          <label for="setting-gold"><span data-i18n="resources.gold.name"></span><output id="setting-gold-value" for="setting-gold">1</output><input id="setting-gold" type="range" min="0" max="10" step="1" value="1" /></label>
        </div>
      </fieldset>
      <div class="dialog-actions settings-actions">
        <button id="settings-start" class="primary" type="button" data-i18n="app.startGame"></button>
        <button id="lobby-start" class="primary" type="button" hidden data-i18n="app.startGame"></button>
      </div>
    </dialog>
    <dialog id="catalogue-dialog" aria-labelledby="catalogue-title">
      <button class="close dialog-close" aria-label="" data-i18n-aria-label="static.closeCatalogue">×</button>
      <span class="eyebrow" data-i18n="static.theKINGDOMSCONTENTS"></span>
      <h2 id="catalogue-title" data-i18n="static.catalogue"></h2>
      <nav class="catalogue-tabs" aria-label="" data-i18n-aria-label="static.catalogueContents">
        <button data-catalogue-section="buildings" aria-pressed="true" aria-controls="catalogue-buildings" data-i18n="views.buildings"></button>
        <button data-catalogue-section="tiles" aria-pressed="false" aria-controls="catalogue-tiles" data-i18n="static.tiles"></button>
        <button data-catalogue-section="maps" aria-pressed="false" aria-controls="catalogue-maps" data-i18n="maps.catalogue"></button>
      </nav>
      <div id="catalogue-content"></div>
    </dialog>
    <dialog id="building-details-dialog" aria-labelledby="building-details-title">
      <button class="close dialog-close close-building-details" type="button" autofocus data-i18n-aria-label="static.closeDetails">×</button>
      <div id="building-details-content"></div>
    </dialog>
    <dialog id="rules-dialog" aria-labelledby="rules-title">
      <button class="close dialog-close" aria-label="" data-i18n-aria-label="static.close">×</button
      ><span class="eyebrow" data-i18n="static.theKINGDOMSRULEBOOK"></span>
      <h2 id="rules-title" data-i18n="static.duelRules"></h2>
      <div class="rules-content"></div>
    </dialog>
    <dialog id="result-dialog" aria-labelledby="winner">
      <button class="close dialog-close close-results" type="button" data-i18n-aria-label="static.close">×</button>
      <h2 id="winner"></h2>
      <div id="results"></div>
    </dialog>
    <dialog id="prestige-dialog" aria-labelledby="prestige-title">
      <button class="close dialog-close" type="button" data-close-dialog="prestige-dialog" data-i18n-aria-label="static.close">×</button>
      <h2 id="prestige-title" data-i18n="static.buyMissingResources"></h2>
      <p id="prestige-warning"></p>
      <div class="dialog-actions">
        <button class="cancel secondary" data-i18n="static.cancel"></button
        ><button class="confirm primary" data-i18n="static.confirm"></button>
      </div>
    </dialog>
    <script type="module" src="src/bootstrap.js"></script>
  </body>
</html>
